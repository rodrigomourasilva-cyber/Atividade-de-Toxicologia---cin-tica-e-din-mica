<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interativo: Toxicocinética e Toxicodinâmica</title>
  <style>
    :root {
      --primary: #5c2d91;
      --primary-light: #7b42b8;
      --success: #28a745;
      --danger: #dc3545;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background: var(--card-bg); width: 100%; max-width: 600px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); padding: 24px; }
    .progress-bar-container { background: #e0e0e0; border-radius: 10px; height: 10px; width: 100%; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }
    .badge { display: inline-block; padding: 4px 10px; font-size: 12px; font-weight: bold; border-radius: 20px; background: #eee; color: #555; margin-bottom: 12px; }
    h2 { font-size: 1.25rem; margin-bottom: 20px; line-height: 1.4; }
    .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .option-btn { background: #fff; border: 2px solid #ddd; padding: 12px 16px; border-radius: 10px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover:not([disabled]) { border-color: var(--primary-light); background: #fdfbff; }
    .option-btn.correct { background: #e8f5e9; border-color: var(--success); color: var(--success); font-weight: bold; }
    .option-btn.wrong { background: #ffebee; border-color: var(--danger); color: var(--danger); }
    .feedback-card { display: none; padding: 14px; border-radius: 10px; margin-bottom: 20px; line-height: 1.4; font-size: 0.95rem; }
    .feedback-card.show { display: block; background: #f0f4ff; border-left: 4px solid var(--primary); }
    .btn-action { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; display: none; }
    .btn-action.show { display: block; }
    .result-screen, .rating-screen { display: none; text-align: center; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 20px auto; font-size: 2rem; font-weight: bold; }
    .star-rating { display: flex; justify-content: center; gap: 8px; margin: 16px 0; font-size: 2rem; cursor: pointer; }
    .star { color: #ccc; transition: color 0.2s; }
    .star.active { color: #ffb800; }
    textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; resize: none; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div id="quiz-screen">
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <span id="question-number" class="badge">Questão 1 de 20</span>
    <h2 id="question-text">Texto da Pergunta</h2>
    <div id="options-container" class="options-list"></div>
    <div id="feedback-card" class="feedback-card"></div>
    <button id="next-btn" class="btn-action" onclick="proximaQuestao()">Próxima Questão</button>
  </div>

  <div id="result-screen" class="result-screen">
    <h2>Teste Concluído!</h2>
    <div class="score-circle">
      <span id="final-score">0</span>
      <span style="font-size: 0.8rem; font-weight: normal;">de 20</span>
    </div>
    <p id="feedback-msg" style="margin-bottom: 24px;"></p>
    <button class="btn-action show" onclick="irParaAvaliacao()">Avaliar a Atividade</button>
  </div>

  <div id="rating-screen" class="rating-screen">
    <h2>Avalie a Aula de Hoje</h2>
    <p style="color: #666; font-size: 0.9rem; margin-top: 8px;">Sua opinião ajuda a melhorar os próximos materiais da FIEB.</p>
    <div class="star-rating" id="stars">
      <span class="star" onclick="avaliar(1)">★</span>
      <span class="star" onclick="avaliar(2)">★</span>
      <span class="star" onclick="avaliar(3)">★</span>
      <span class="star" onclick="avaliar(4)">★</span>
      <span class="star" onclick="avaliar(5)">★</span>
    </div>
    <textarea id="comment" rows="3" placeholder="Deixe um comentário sobre a dinâmica ou o conteúdo (opcional)..."></textarea>
    <button class="btn-action show" style="margin-top: 16px;" onclick="finalizar()">Enviar Avaliação</button>
  </div>
</div>

<script>
  const questoes = [
    {
      pergunta: "O que a toxicocinética estuda no organismo?",
      opcoes: ["Apenas a eliminação do agente tóxico.", "O movimento do agente tóxico, da entrada até a eliminação.", "As alterações estruturais causadas nas células.", "A interação do tóxico com receptores específicos."],
      correta: 1,
      explicacao: "A toxicocinética define o caminho do tóxico no organismo (Absorção, Distribuição, Metabolismo e Excreção)[cite: 1]."
    },
    {
      pergunta: "Quais são as quatro etapas do processo ADME?",
      opcoes: ["Ação, Distribuição, Mutação e Excreção.", "Absorção, Distribuição, Metabolismo (Biotransformação) e Excreção.", "Absorção, Diluição, Metabolismo e Eliminação.", "Ação, Diluição, Modulação e Excreção."],
      correta: 1,
      explicacao: "ADME compreende as fases de Absorção, Distribuição, Metabolismo (ou Biotransformação) e Excreção[cite: 1]."
    },
    {
      pergunta: "Qual via de exposição costuma levar o tóxico à circulação sistêmica de forma muito rápida devido à alta vascularização?",
      opcoes: ["Via oral", "Via cutânea", "Via respiratória (inalatória)", "Via ocular"],
      correta: 2,
      explicacao: "A via respiratória permite absorção muito rápida graças à grande superfície alveolar e sua alta vascularização[cite: 1]."
    },
    {
      pergunta: "A via de exposição parenteral (injetável) possui qual característica em relação à absorção?",
      opcoes: ["Absorção imediata, pois o tóxico cai direto na circulação.", "Absorção lenta, dependendo da hidratação do tecido.", "Sofre grande efeito de primeira passagem hepática.", "Requer biotransformação antes de ser absorvida."],
      correta: 0,
      explicacao: "Na via parenteral (especialmente intravenosa), não há processo de absorção, a substância entra imediatamente na corrente sanguínea[cite: 1]."
    },
    {
      pergunta: "Quais características facilitam a passagem de um tóxico através das membranas biológicas na fase de absorção?",
      opcoes: ["Forma ionizada e hidrossolubilidade.", "Forma não-ionizada e lipossolubilidade.", "Baixo pH e alta viscosidade.", "Forma ionizada e grande superfície de contato."],
      correta: 1,
      explicacao: "As membranas biológicas são permeáveis principalmente a substâncias na sua forma não-ionizada e que possuem alta lipossolubilidade[cite: 1]."
    },
    {
      pergunta: "Durante a distribuição do tóxico pelo sangue, qual fração é considerada farmacologicamente ativa?",
      opcoes: ["Fração ligada às proteínas plasmáticas.", "Fração conjugada da Fase II.", "Fração livre.", "Fração excretada pelos rins."],
      correta: 2,
      explicacao: "Apenas a fração livre (não ligada a proteínas como a albumina) é ativa e capaz de interagir com os tecidos alvo[cite: 1]."
    },
    {
      pergunta: "A barreira hematoencefálica dificulta principalmente a entrada de quais tipos de substâncias no sistema nervoso central?",
      opcoes: ["Substâncias muito lipossolúveis.", "Substâncias hidrossolúveis.", "Gases tóxicos.", "Solventes industriais lipídicos."],
      correta: 1,
      explicacao: "A barreira hematoencefálica protege o SNC dificultando a entrada de substâncias hidrossolúveis, mas permite a passagem das muito lipossolúveis[cite: 1]."
    },
    {
      pergunta: "Onde ocorre predominantemente o processo de biotransformação (metabolismo)?",
      opcoes: ["Nos rins.", "No estômago.", "No fígado.", "Nos pulmões."],
      correta: 2,
      explicacao: "O fígado é o principal órgão responsável por transformar o tóxico em substâncias mais hidrossolúveis para facilitar a excreção[cite: 1]."
    },
    {
      pergunta: "O que é o fenômeno da bioativação?",
      opcoes: ["Quando a eliminação renal é acelerada.", "Quando a biotransformação gera metabólitos ainda mais tóxicos.", "A neutralização imediata do tóxico no estômago.", "O bloqueio dos receptores por antagonistas."],
      correta: 1,
      explicacao: "Em alguns casos, a metabolização não inativa a substância, mas sim gera um metabólito com toxicidade maior do que a molécula original[cite: 1]."
    },
    {
      pergunta: "Qual é a principal via de excreção dos agentes tóxicos e seus metabólitos?",
      opcoes: ["Via pulmonar.", "Via renal (urina).", "Via biliar/fecal.", "Via cutânea."],
      correta: 1,
      explicacao: "A eliminação pelos rins, através da urina, é a principal e mais importante via de excreção do organismo[cite: 1]."
    },
    {
      pergunta: "O que a toxicodinâmica estuda?",
      opcoes: ["O trajeto do tóxico pelo sistema digestivo.", "Como o tóxico age nas células e tecidos, causando alterações.", "A velocidade de eliminação renal.", "A lipossolubilidade das membranas."],
      correta: 1,
      explicacao: "A toxicodinâmica foca em 'o que o tóxico faz com o corpo', estudando seus mecanismos de ação nas células[cite: 1]."
    },
    {
      pergunta: "No modelo chave-fechadura de receptores, como atua um agente antagonista?",
      opcoes: ["Ele ativa o receptor, imitando uma substância natural.", "Ele destrói estruturalmente o receptor.", "Ele ocupa o receptor e bloqueia a resposta normal.", "Ele se liga ao DNA impedindo a replicação celular."],
      correta: 2,
      explicacao: "Um antagonista bloqueia o receptor, impedindo que a molécula mensageira natural se ligue e ative a resposta biológica[cite: 1]."
    },
    {
      pergunta: "Os organofosforados são exemplos clássicos de tóxicos que atuam por inibição enzimática. Qual enzima eles bloqueiam?",
      opcoes: ["Glutationa.", "Albumina plasmática.", "Acetilcolinesterase.", "Enzimas CYP450."],
      correta: 2,
      explicacao: "Eles inibem a acetilcolinesterase, causando um acúmulo excessivo de acetilcolina e resultando em síndrome colinérgica[cite: 1]."
    },
    {
      pergunta: "Qual é o principal dano celular provocado pelo estresse oxidativo mediado por radicais livres?",
      opcoes: ["Aceleração da excreção renal.", "Hiperativação dos receptores.", "Peroxidação lipídica, que compromete a membrana celular.", "Aumento na produção de albumina."],
      correta: 2,
      explicacao: "Os radicais livres atacam lipídios (peroxidação lipídica), o que rompe a integridade da membrana e pode causar a morte celular[cite: 1]."
    },
    {
      pergunta: "Na toxicologia, o que o indicador DL50 representa?",
      opcoes: ["A dose necessária para tratar 50% dos pacientes.", "A dose capaz de causar a morte de 50% da população testada.", "O tempo (50 horas) para eliminação total do tóxico.", "O limite seguro de exposição diária."],
      correta: 1,
      explicacao: "A Dose Letal 50 (DL50) é o parâmetro utilizado para avaliar e comparar o quão letal uma substância é para uma população[cite: 1]."
    },
    {
      pergunta: "Qual é a relação direta entre o valor da DL50 e a toxicidade de uma substância?",
      opcoes: ["Quanto MAIOR a DL50, MAIOR a toxicidade.", "A DL50 não tem relação com a toxicidade.", "Quanto MENOR a DL50, MAIOR a toxicidade.", "A toxicidade só é medida pela via de exposição."],
      correta: 2,
      explicacao: "Se uma dose muito pequena já é capaz de ser letal para 50% da população, significa que o composto é altamente tóxico[cite: 1]."
    },
    {
      pergunta: "Quais fatores inerentes ao próprio indivíduo podem modular a gravidade de uma resposta tóxica?",
      opcoes: ["Apenas a dose administrada.", "Apenas o tempo de exposição.", "Idade, genética, estado nutricional e de saúde.", "O grau de ionização do medicamento."],
      correta: 2,
      explicacao: "Fatores biológicos próprios do paciente (como a função renal/hepática, genética e idade) influenciam a intensidade da resposta tóxica[cite: 1]."
    },
    {
      pergunta: "No estudo de caso clínico de intoxicação por paracetamol, o excesso é metabolizado por qual enzima na Fase I?",
      opcoes: ["Acetilcolinesterase", "CYP2E1", "Glutationa redutase", "Albumina"],
      correta: 1,
      explicacao: "Quando as vias de Fase II saturam, o CYP2E1 assume a metabolização do paracetamol, gerando o metabólito tóxico[cite: 1]."
    },
    {
      pergunta: "Qual é a sigla do metabólito tóxico responsável pela necrose hepática na overdose de paracetamol?",
      opcoes: ["GSH", "CYP450", "ADME", "NAPQI"],
      correta: 3,
      explicacao: "A bioativação do paracetamol gera o NAPQI, um metabólito que esgota as reservas de glutationa e causa danos severos ao fígado[cite: 1]."
    },
    {
      pergunta: "Qual é o tratamento/antídoto utilizado para repor a glutationa e neutralizar o NAPQI na intoxicação por paracetamol?",
      opcoes: ["Atropina", "N-acetilcisteína", "Carvão ativado contínuo", "Diálise imediata"],
      correta: 1,
      explicacao: "A N-acetilcisteína é administrada para repor os estoques de glutationa e agir diretamente na neutralização do NAPQI[cite: 1]."
    }
  ];

  let questaoAtual = 0;
  let pontuacao = 0;
  let estrelas = 0;

  function carregarQuestao() {
    const q = questoes[questaoAtual];
    document.getElementById("progress-bar").style.width = ((questaoAtual) / questoes.length * 100) + "%";
    document.getElementById("question-number").innerText = `Questão ${questaoAtual + 1} de ${questoes.length}`;
    document.getElementById("question-text").innerText = q.pergunta;
    
    const container = document.getElementById("options-container");
    container.innerHTML = "";
    document.getElementById("feedback-card").className = "feedback-card";
    document.getElementById("next-btn").className = "btn-action";

    q.opcoes.forEach((opcao, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = opcao;
      btn.onclick = () => checarResposta(index);
      container.appendChild(btn);
    });
  }

  function checarResposta(selecionada) {
    const q = questoes[questaoAtual];
    const botoes = document.querySelectorAll(".option-btn");
    botoes.forEach(b => b.disabled = true);

    const feedback = document.getElementById("feedback-card");
    if (selecionada === q.correta) {
      botoes[selecionada].classList.add("correct");
      feedback.innerHTML = `<strong>Correto!</strong> ${q.explicacao}`;
      pontuacao++;
    } else {
      botoes[selecionada].classList.add("wrong");
      botoes[q.correta].classList.add("correct");
      feedback.innerHTML = `<strong>Incorreto.</strong> ${q.explicacao}`;
    }
    feedback.classList.add("show");
    document.getElementById("next-btn").classList.add("show");
  }

  function proximaQuestao() {
    questaoAtual++;
    if (questaoAtual < questoes.length) {
      carregarQuestao();
    } else {
      mostrarResultado();
    }
  }

  function mostrarResultado() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("final-score").innerText = pontuacao;
    
    const msg = document.getElementById("feedback-msg");
    const perc = (pontuacao / questoes.length) * 100;
    if (perc >= 80) msg.innerText = "Excelente desempenho! Domínio sólido dos conceitos.";
    else if (perc >= 60) msg.innerText = "Bom trabalho! Vale a pena revisar os detalhes de biotransformação.";
    else msg.innerText = "Recomendamos revisar os slides de ADME e mecanismos de toxicidade.";
  }

  function irParaAvaliacao() {
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("rating-screen").style.display = "block";
  }

  function avaliar(n) {
    estrelas = n;
    const s = document.querySelectorAll(".star");
    s.forEach((el, idx) => {
      el.classList.toggle("active", idx < n);
    });
  }

  function finalizar() {
    alert("Avaliação recebida! Obrigado por participar.");
    location.reload();
  }

  carregarQuestao();
</script>
</body>
</html>
